<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球录像分析</title><link rel="stylesheet" href="./workspace.css"></head>
<body>
<header><h1>篮球录像分析</h1><div class="actions"><label class="button primary">选择录像<input id="video-file" type="file" accept="video/*,.media" hidden></label><label class="button">导入事件表<input id="events-file" type="file" accept=".json,.jsonl" hidden></label><button id="export">导出复核结果</button></div></header>
<p id="notice" role="status">正在载入已保存的事件…</p>
<main>
 <section class="panel viewer" aria-label="录像与复核">
  <div class="panel-head"><h2 id="match-title">比赛录像</h2><span>本机回看，不上传</span></div>
  <div class="stage"><video id="video" controls playsinline></video><div id="empty"><p>选择录像，再点击右侧事件</p><label class="button primary">选择录像<input id="empty-file" type="file" accept="video/*,.media" hidden></label></div></div>
  <div class="selection"><h3 id="event-title">选择一个事件</h3><p id="evidence"></p><div id="positions" class="actions"></div></div>
  <form id="review" class="review">
   <div class="review-heading"><h3>人工复核</h3><span id="save-state" role="status">修改只保存在当前浏览器</span></div>
   <label>事件说明<input id="description" maxlength="500" placeholder="补充或修正这次动作"></label>
   <div class="times"><label>开始（秒）<input id="start" type="number" min="0" step="0.1"></label><button type="button" id="use-start">取当前时间</button><label>结束（秒）<input id="end" type="number" min="0" step="0.1"></label><button type="button" id="use-end">取当前时间</button></div>
   <div class="actions"><button type="submit" class="primary" id="confirm">确认并保存</button><button type="button" id="reject">标记不符</button><button type="button" id="reset">撤销我的修改</button><button type="button" id="add">＋ 补漏事件</button></div>
  </form>
  <details class="selection" id="ai"><summary>AI 分析 · 球员 / 比赛</summary><p>先双击本机“启动篮球AI”，再连接。录像不上传云端；首次连接请允许浏览器访问本地网络。</p><button id="ai-connect">连接本机 Qwen3.5</button><p id="ai-connection" role="status"></p><div id="ai-container"></div></details>
 </section>
 <aside class="panel events" aria-label="事件列表"><div class="panel-head"><h2>事件列表</h2><span id="count"></span></div>
  <div class="filters"><label>状态<select id="status"><option value="">全部</option><option value="pending">待复核</option><option value="confirmed">已确认</option><option value="rejected">标记不符</option><option value="gap">原片缺段</option></select></label><label>事件<select id="kind"><option value="">全部类型</option></select></label><input id="search" type="search" aria-label="搜索事件" placeholder="搜索球员或事件"></div>
  <div id="event-list"></div>
 </aside>
</main><script type="module" src="./workspace.mjs"></script><script type="module" src="./ai-ui.mjs"></script></body></html>
